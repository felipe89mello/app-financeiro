{% extends "base.html" %}
{% block title %}Editar forma de pagamento{% endblock %}
{% block content %}

<p style="margin-bottom: 18px;">
  <a href="/formas-pagamento-ui" style="color: var(--ink-soft); text-decoration: none; font-size: 13px;">‹ Voltar</a>
</p>

<section class="block">
  <h2>Editar forma de pagamento</h2>
  <form class="lancar" method="post" action="/ui/formas-pagamento/{{ forma.id }}/editar" style="grid-template-columns: 2fr auto;">
    <div class="field">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" value="{{ forma.nome }}" required>
    </div>
    <button type="submit">Salvar</button>
  </form>
  <p class="empty" style="margin-top: 14px;">
    Isso muda só o nome na lista de opções — não altera o texto já salvo em lançamentos antigos que usaram o nome anterior.
  </p>
</section>

{% endblock %}
