<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}App Financeiro{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>Livro-Caixa</h1>
      <nav>
        <a href="/" class="{% if ativo == 'dashboard' %}active{% endif %}">Lançamentos</a>
        <a href="/balanco/{{ ano_atual_nav }}" class="{% if ativo == 'balanco' %}active{% endif %}">Balanço Anual</a>
        <a href="/categorias-ui" class="{% if ativo == 'categorias' %}active{% endif %}">Categorias</a>
        <a href="/contas-fixas-ui" class="{% if ativo == 'contas_fixas' %}active{% endif %}">Contas Fixas</a>
        <a href="/formas-pagamento-ui" class="{% if ativo == 'formas_pagamento' %}active{% endif %}">Formas de Pagamento</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
